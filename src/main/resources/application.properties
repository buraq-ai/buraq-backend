# ==================== Application ====================
spring.application.name=buraq-backend
server.port=8081

# ==================== PostgreSQL ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/buraq_db
spring.datasource.username=buraq_user
spring.datasource.password=buraq_pass

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicit dialect (helps when connection fails early)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging - very useful for debugging connection issues
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG

# Disable Spring Security auto-configuration for now (we'll add JWT later)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ====================== JWT Configuration ======================
jwt.secret=your-super-secret-jwt-key-at-least-256-bits-long-change-in-production
# 15 minutes (in milliseconds)
jwt.expiration=900000
# 7 days (in milliseconds)
jwt.refresh-expiration=604800000

# For better security in production, use a strong base64 encoded secret
# Example of a strong secret (DO NOT use this one in production):
# jwt.secret=SGVsbG8gV29ybGQgVGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgSlFXVCBzaWduaW5n

# ==================== File Upload Configuration ====================
# Maximum size for a single uploaded file (10MB)
spring.servlet.multipart.max-file-size=10MB
# Maximum size for the entire multipart request (10MB)
spring.servlet.multipart.max-request-size=10MB

# Base directory where uploaded documents will be stored
# Files will be saved to: uploads/documents/{year}/{month}/{uuid_filename}
app.storage.path=uploads/documents

# AI Microservice URL (will be used in next step)
ai.service.url=http://localhost:8000

